services:
  clawguard:
    build: .
    container_name: clawguard
    ports:
      - "9090:9090"
      - "9443:9443"   # admin HTTPS — only used when admin.https.enabled=true
    volumes:
      - ./clawguard.yaml:/app/clawguard.yaml:ro   # config (read-only)
      - ./data:/app/data                            # SQLite DB persistence
      - clawguard-ssh-runtime:/run/clawguard-ssh    # broker + short-lived agent sockets
      - clawguard-ftp-runtime:/run/clawguard-ftp    # private control socket to FTP sidecar
    environment:
      # Pass through when present in the shell or .env, without a Compose
      # warning when the YAML uses another secret source.
      - TELEGRAM_BOT_TOKEN
      # Optional deployment-specific address used by ftpGateway.publicHost in
      # clawguard.yaml. Compose port bindings default safely to loopback.
      - CLAWGUARD_GATEWAY_BIND_IP
    restart: unless-stopped
    stop_grace_period: 20s

  # Experimental SSH gateway. It is managed by the normal Compose lifecycle;
  # sshBroker.enabled controls whether ClawGuard serves broker requests.
  clawguard-ssh:
    build:
      context: ./ssh-gateway
    container_name: clawguard-ssh
    depends_on:
      - clawguard
    ports:
      # Local-only by default; set CLAWGUARD_GATEWAY_BIND_IP in .env for LAN.
      - "${CLAWGUARD_GATEWAY_BIND_IP:-127.0.0.1}:2222:2222"
    environment:
      - CLAWGUARD_SSH_BROKER_SOCKET=${CLAWGUARD_SSH_BROKER_SOCKET:-/run/clawguard-ssh/broker.sock}
      - CLAWGUARD_SSH_BROKER_TIMEOUT_SECONDS=${CLAWGUARD_SSH_BROKER_TIMEOUT_SECONDS:-135}
    volumes:
      - clawguard-ssh-runtime:/run/clawguard-ssh
      - clawguard-ssh-host-keys:/data
      # Host-side inbound public keys. The directory may initially be empty;
      # SSH then starts fail-closed and accepts no client keys.
      #   mkdir -p ./data/ssh-gateway
      #   cp ~/.ssh/id_ed25519.pub ./data/ssh-gateway/authorized_keys
      - ./data/ssh-gateway:/config:ro
    restart: unless-stopped

  # Experimental FTP/explicit-FTPS gateway. It is managed by the normal
  # Compose lifecycle; each approved lease gets an isolated rclone process.
  clawguard-ftp:
    build:
      context: ./ftp-gateway
    container_name: clawguard-ftp
    depends_on:
      - clawguard
    ports:
      # Local-only, single-session defaults for the experimental gateway.
      - "${CLAWGUARD_GATEWAY_BIND_IP:-127.0.0.1}:21210:21210"
      - "${CLAWGUARD_GATEWAY_BIND_IP:-127.0.0.1}:30000-30009:30000-30009"
    environment:
      - CLAWGUARD_FTP_GATEWAY_SOCKET=${CLAWGUARD_FTP_GATEWAY_SOCKET:-/run/clawguard-ftp/gateway.sock}
      - CLAWGUARD_FTP_CONTROL_PORT_START=${CLAWGUARD_FTP_CONTROL_PORT_START:-21210}
      - CLAWGUARD_FTP_CONTROL_PORT_END=${CLAWGUARD_FTP_CONTROL_PORT_END:-21210}
      - CLAWGUARD_FTP_PASSIVE_PORT_START=${CLAWGUARD_FTP_PASSIVE_PORT_START:-30000}
      - CLAWGUARD_FTP_PASSIVE_PORTS_PER_SESSION=${CLAWGUARD_FTP_PASSIVE_PORTS_PER_SESSION:-10}
      - CLAWGUARD_FTP_MAX_SESSIONS=${CLAWGUARD_FTP_MAX_SESSIONS:-1}
      - CLAWGUARD_FTP_MAX_SESSION_SECONDS=${CLAWGUARD_FTP_MAX_SESSION_SECONDS:-86400}
      - CLAWGUARD_FTP_PUBLIC_IP=${CLAWGUARD_FTP_PUBLIC_IP:-${CLAWGUARD_GATEWAY_BIND_IP:-127.0.0.1}}
      - CLAWGUARD_FTP_TLS_HOSTNAME=${CLAWGUARD_FTP_TLS_HOSTNAME:-${CLAWGUARD_GATEWAY_BIND_IP:-localhost}}
    volumes:
      - clawguard-ftp-runtime:/run/clawguard-ftp
      - clawguard-ftp-tls:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      # Entrypoint prepares named-volume ownership, then su-exec drops to UID 10002.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  # Shared only by ClawGuard and the SSH sidecar. The fixed gateway account is
  # UID/GID 10001; ClawGuard grants that group traverse/use access without
  # making the sidecar user owner of the runtime directory.
  clawguard-ssh-runtime:
  # Persists the sidecar's OpenSSH host identity across container recreation.
  clawguard-ssh-host-keys:
  clawguard-ftp-runtime:
  clawguard-ftp-tls:
