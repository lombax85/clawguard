name: "CI: Unit Tests"

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        shell: bash
        run: |
          log_file="$RUNNER_TEMP/clawguard-tests.log"
          if npm test 2>&1 | tee "$log_file"; then
            exit 0
          fi

          # Include failing TAP diagnostics in the Checks API for CI triage.
          failure="$(awk '
            /^[[:space:]]*not ok / { capture = 1 }
            capture && count < 100 { print; count++ }
            capture && /^[[:space:]]*\.\.\./ { capture = 0 }
          ' "$log_file")"
          if [ -z "$failure" ]; then
            failure="$(tail -n 30 "$log_file")"
          fi
          failure="${failure//%/%25}"
          failure="${failure//$'\r'/%0D}"
          failure="${failure//$'\n'/%0A}"
          printf '::error title=Build or tests failed::%s\n' "$failure"
          exit 1
